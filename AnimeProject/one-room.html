<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Room</title>

  <link rel="stylesheet" href="../css/index.css" />
  <link rel="stylesheet" href="../css/light-dark-theme.css" />
  <link rel="icon" href="../favicon.ico" type="image/x-icon" />

  <script>
    (() => {
      const mode = localStorage.getItem("theme-mode") || "light";
      const variant = localStorage.getItem("theme-variant") || "default";
      document.documentElement.className = "";
      document.write(`<body class="${mode} ${variant}">`);
    })();
  </script>

  <style>
    main {
      padding: 1rem;
      max-width: 960px;
      margin: auto;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 2rem;
      color: var(--subtitle-color);
    }

    .season-title {
      font-size: 1.2rem;
      color: var(--subtitle-color);
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .episode-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .episode-button {
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      color: var(--text-color);
      background: var(--card-bg);
      transition: 0.2s ease;
      min-width: 40px;
    }

    .episode-button:hover {
      background: var(--hover-bg);
      color: var(--accent-color);
    }

    .episode-button.active {
      background: var(--accent-color);
      color: #fff;
    }

    iframe {
      width: 100%;
      max-width: 640px;
      height: 360px;
      border: none;
      border-radius: 16px;
      margin: 20px auto 20px;
      display: block;
      background-color: var(--card-bg);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<main>
  <h1>One Room</h1>

  <iframe id="player1" allowfullscreen></iframe>
  <iframe id="player2" allowfullscreen style="display: none;"></iframe>

  <div id="episodes-container"></div>
</main>

<script>
  const url = new URLSearchParams(location.search);
  const ep = parseInt(url.get("ep")) || 0;
  const season = url.get("season") || "s1";

  const allSeasons = {
    s1: {
      name: "Season 1",
      episodes: 12,
      links: [
        ["https://player.abyssplayer.com/isltIbvrD"],
        ["https://player.abyssplayer.com/9JKIki5zh"],
        ["https://player.abyssplayer.com/RNn5o4MAi"],
        ["https://player.abyssplayer.com/7g8FtkP71"],
        ["https://player.abyssplayer.com/z2DEVVm49"],
        ["https://player.abyssplayer.com/OrqqYVDyI"],
        ["https://player.abyssplayer.com/SBxxDOJic"],
        ["https://player.abyssplayer.com/aj2Ep_RJC"],
        ["https://player.abyssplayer.com/Zk0OSVsJR"],
        ["https://player.abyssplayer.com/GNFERw77je"],
        ["https://player.abyssplayer.com/aEBspOmQM"],
        ["https://player.abyssplayer.com/v1OtOPs1N"]
      ]
    },
    ova1: {
      name: "OVA 1",
      episodes: 1,
      links: [["$$"]]
    },
    s2: {
      name: "Season 2",
      episodes: 12,
      links: [
        ["https://player.abyssplayer.com/0w8NwRVjX"],
        ["https://player.abyssplayer.com/gVqMJD0rS"],
        ["https://player.abyssplayer.com/rOpAuqZGLv"],
        ["https://player.abyssplayer.com/64cNs4jLc"],
        ["https://player.abyssplayer.com/SrIM7Niw-"],
        ["https://player.abyssplayer.com/CgL_MrQiu"],
        ["https://player.abyssplayer.com/9GPoLtZVz"],
        ["https://player.abyssplayer.com/GxAYdJd6W"],
        ["https://player.abyssplayer.com/7-86Ep55L"],
        ["https://player.abyssplayer.com/A6TID6NwS"],
        ["https://player.abyssplayer.com/dxE6PG8Ps0"],
        ["https://player.abyssplayer.com/Exd_QsRr4"]
      ]
    },
    s3: {
      name: "Season 3",
      episodes: 12,
      links: [
        ["https://player.abyssplayer.com/8sB3H4zKs"],
        ["https://player.abyssplayer.com/OV0rZRbN0"],
        ["https://player.abyssplayer.com/dZZg2FTvw"],
        ["https://player.abyssplayer.com/DrvA5ozKj"],
        ["https://player.abyssplayer.com/S8HM4-y1F"],
        ["https://player.abyssplayer.com/Ga-jM8igU"],
        ["https://player.abyssplayer.com/_2j7uW66y"],
        ["https://player.abyssplayer.com/cpoArVD2C"],
        ["https://player.abyssplayer.com/A2jRr111K"],
        ["https://player.abyssplayer.com/Qnaq9Be_y"],
        ["https://player.abyssplayer.com/wMfwwK7cX"],
        ["https://player.abyssplayer.com/sgtCbM2PP"]
      ]
    }
  };

  const container = document.getElementById("episodes-container");

  for (const [key, seasonData] of Object.entries(allSeasons)) {
    const div = document.createElement("div");

    const title = document.createElement("div");
    title.className = "season-title";
    title.textContent = seasonData.name;
    div.appendChild(title);

    const group = document.createElement("div");
    group.className = "episode-buttons";

    for (let i = 0; i < seasonData.episodes; i++) {
      const btn = document.createElement("a");
      btn.className = "episode-button";
      if (key === season && i === ep) btn.classList.add("active");

      btn.textContent = i + 1;
      btn.href = `?season=${key}&ep=${i}`;

      group.appendChild(btn);
    }

    div.appendChild(group);
    container.appendChild(div);
  }

  const currentSeason = allSeasons[season];
  const currentLinks = currentSeason?.links[ep] || [];

  const player1 = document.getElementById("player1");
  const player2 = document.getElementById("player2");

  if (currentLinks.length >= 1 && currentLinks[0] !== "$$") {
    player1.src = currentLinks[0];
    player1.style.display = "block";
  } else {
    player1.style.display = "none";
  }

  if (currentLinks.length >= 2 && currentLinks[1] !== "$$") {
    player2.src = currentLinks[1];
    player2.style.display = "block";
  } else {
    player2.style.display = "none";
  }
</script>

<script src="../js/index.js" defer></script>
<script src="/All-That-Animu/js/index.js"></script>
</html>
